<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WXPush · 详情页预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#313942;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.toolbar{padding:22px 28px;background:#fff;border-bottom:1px solid #dde2e8;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.title{font-size:14px;font-weight:600}.note{font-size:12px;color:#939aa3;margin-top:5px}.controls{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid transparent;border-radius:7px;padding:8px 12px;background:#f4f5f7;color:#737d89;font:inherit;font-size:12px;cursor:pointer}button[aria-pressed=true]{background:#303941;color:#fff}button:focus-visible{outline:2px solid #6d89a2;outline-offset:2px}.stage{display:flex;justify-content:center;padding:30px 24px 42px}iframe{display:block;width:390px;max-width:100%;height:760px;border:1px solid #dce1e6;border-radius:14px;background:#f7f8fa;box-shadow:0 12px 35px #2436480b}body.wide iframe{width:1050px;height:760px}details{max-width:680px;margin:0 auto 36px;padding:0 24px;font-size:12px;color:#6b7581}summary{cursor:pointer}textarea{display:block;width:100%;margin:12px 0;font:12px/1.6 ui-monospace,monospace;padding:14px;border:1px solid #d7dce2;border-radius:8px;background:white;color:#39424d;min-height:210px}#error{color:#a33d37;margin-left:10px}@media(max-width:500px){.toolbar{padding:18px}.controls{gap:4px}button{padding:8px}.stage{padding:16px 10px}iframe{border-radius:10px;height:720px}}
</style></head><body>
<header class="toolbar"><div><div class="title">消息详情 · 样式预览</div><div class="note">统一上下布局 · 本地预览 · 所有内容均为样例</div></div><div class="controls" role="group" aria-label="预览场景"><button data-case="result" aria-pressed="true">执行结果</button><button data-case="no_trade" aria-pressed="false">未交易</button><button data-case="error" aria-pressed="false">执行异常</button><button data-case="custom" aria-pressed="false">自定义字段</button><button data-case="legacy" aria-pressed="false">旧格式</button><button id="size" aria-pressed="false">桌面宽度</button></div></header>
<div class="stage"><iframe id="frame" title="消息详情预览"></iframe></div>
<details><summary>修改样例参数</summary><textarea id="editor" aria-label="模板字段 JSON" spellcheck="false"></textarea><button id="apply">预览这些参数</button><span id="error" role="status"></span></details>
<script>
const samples={
 result:{template_id:'koI8SKMjsvCjDb6OOTjUEOjQ3TvBLoSUvUrh-uZskTE',title:'执行结果',date:'2026-10-24 12:22:40',template_data:{strategy:{value:'UTC0 Short'},event:{value:'执行结果'},message:{value:'净+1.2300 USDT / +2.46% · 信号3.90%\nADAUSDT 空10@2→平10@1.875 净+1.2300U\nBMTUSDT 未成交'}}},
 no_trade:{template_id:'koI8SKMjsvCjDb6OOTjUEOjQ3TvBLoSUvUrh-uZskTE',title:'执行结果',date:'2026-10-24 08:21:10',template_data:{strategy:'UTC0 Short',event:'执行结果',message:'未交易 · 信号2.98% · 0 USDT / 0.00%'}},
 error:{title:'执行异常',date:'2026-10-24 08:21:12',template_data:{strategy:'UTC0 Short',event:'执行异常',message:'止损保护异常 · ADAUSDT'}},
 custom:{title:'任务完成',date:'2026-10-24 12:22:40',template_data:{thing1:{value:'ADAUSDT'},amount2:{value:'120 USDT'},执行耗时:'3.2 秒',重试次数:0,启用保护:false}},
 legacy:{title:'Order Filled',content:'Polytope 订单已成交\n\n策略：示例策略\n方向：BUY\n成交金额：25.00 USDC',date:'2026-10-24 12:22:40'}
};
const frame=document.getElementById('frame'),editor=document.getElementById('editor');let current='result';
function show(name){current=name;document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.case===name)));const data=samples[name];editor.value=JSON.stringify(data,null,2);frame.src='../src/landing/index.html'+(name==='legacy'?'?'+new URLSearchParams(data):'#'+new URLSearchParams({data:JSON.stringify(data)}));}
document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.case)));
document.getElementById('size').addEventListener('click',()=>{document.body.classList.toggle('wide');document.getElementById('size').setAttribute('aria-pressed',String(document.body.classList.contains('wide')));});
document.getElementById('apply').addEventListener('click',()=>{try{const data=JSON.parse(editor.value);if(!data||typeof data!=='object'||Array.isArray(data))throw Error();frame.src='../src/landing/index.html#'+new URLSearchParams({data:JSON.stringify(data)});document.getElementById('error').textContent='';}catch{document.getElementById('error').textContent='请输入有效的 JSON 对象';}});
show('result');
</script></body></html>
